<style>

.head{max-width:820px;margin:auto;display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:14px;background:var(--a);display:grid;place-items:center;color:#0a0d08;font-size:21px;font-weight:900}.ht{flex:1;min-width:0}h1{font-size:18px;margin:0;font-weight:900}.sub{font-size:12px;color:var(--mut);margin-top:3px}.week{border:1px solid var(--line);background:var(--p2);color:var(--txt);border-radius:12px;padding:8px 9px;font-weight:800}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:600px){.grid2{grid-template-columns:1fr}}.field{border:1px solid var(--line);background:var(--p);border-radius:15px;padding:11px}.field label{display:block;font-size:11px;color:var(--mut);font-weight:800;margin-bottom:7px}.field input[type=number],.field textarea{width:100%;border:1px solid var(--line);background:#0d1116;color:var(--txt);border-radius:10px;padding:9px}.field textarea{min-height:70px;resize:vertical}.checkgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.opt{display:flex;align-items:center;gap:8px;background:#0e1217;border:1px solid var(--line);border-radius:11px;padding:9px;font-size:11px;color:#cbd3dc}.opt input{width:18px;height:18px;accent-color:var(--a)}

<body>
<header><div class="head"><div class="logo">P</div><div class="ht"><h1>Padel Performance</h1><div class="sub">Force · genoux · explosivité · 6 semaines</div></div><select id="weekPick" class="week" onchange="setWeek(this.value)"><option value="1">S1</option><option value="2">S2</option><option value="3">S3</option><option value="4">S4</option><option value="5">S5</option><option value="6">S6</option></select></div><div class="tabs" id="tabs"></div></header>

<script>
const DAYS=["lundi","mardi","mercredi","jeudi","vendredi","samedi","dimanche","suivi"],LABEL={lundi:"Lun",mardi:"Mar",mercredi:"Mer",jeudi:"Jeu",vendredi:"Ven",samedi:"Sam",dimanche:"Dim",suivi:"Suivi"};
let current=localStorage.getItem("pp-day")||"lundi",week=Number(localStorage.getItem("pp-week")||1);
const V={wall:"y-wV4Venusw",med:"NP2e1Szrj28",pull:"eGo4IYlbE5g",row:"-zBPknRjGU",rdl:"xgusDooVfKU",push:"yklSQG1_Ovc",split:"ua1qi5GZyp4",trx:"N_14s8zFOms",pogo:"eGlyz_4h8yw",bound:"UZVip5xlhv0"};
const K=(...a)=>["pp",...a].join("-"),gb=k=>localStorage.getItem(k)==="1",sb=(k,v)=>localStorage.setItem(k,v?"1":"0"),gj=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}},sj=(k,v)=>localStorage.setItem(k,JSON.stringify(v)),esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m])),ys=q=>"https://www.youtube.com/results?search_query="+encodeURIComponent(q);
function stage(w){return Number(localStorage.getItem(K("stage",w))||(w<=2?1:w<=4?2:3))}function setStage(v){localStorage.setItem(K("stage",week),v);render()}function newStage(){return week===1||stage(week)!==stage(week-1)}function stageAge(){let s=stage(week),n=1;for(let w=week-1;w>=1;w--){if(stage(w)===s)n++;else break}return n}
function crit(w){return{pain:gb(K("crit",w,"pain")),base:gb(K("crit",w,"base")),swell:gb(K("crit",w,"swell"))}}function stable(w){let c=crit(w);return c.pain&&c.base&&c.swell}function canAdvance(){if(week<3)return false;let s=stage(week-1);return s<3&&stable(week-1)&&stable(week-2)&&stage(week-2)===s}
function nordic(){return gb(K("nordic",week))}function setNordic(v){if(v&&newStage()&&week>1){alert("Une seule nouveauté : nouvelle étape explosive cette semaine. Garde le slider curl.");render();return}sb(K("nordic",week),v);render()}
function prep(d){return gj(K("prep",week,d),{rpe:6,quads:false,posterior:false,jumps:false,calves:false,upper:false,notes:""})}function savePrep(d,f,v){let p=prep(d);p[f]=v;sj(K("prep",week,d),p);render()}function ready(d){return localStorage.getItem(K("ready",week,d))||"fresh"}function setReady(d,v){localStorage.setItem(K("ready",week,d),v);render()}

function strength(t){let ns=newStage()&&week>1,n=nordic();if(t==="rdl"){if(week===1)return"3 × 8 · RPE 6–7";if(week===2)return"3 × 8 · RPE ~7";if(week===3)return"3 × 6–8 · maintenir si nouvelle étape";if(week===4)return n?"3 × 6–8 · maintenir (Nordic = nouveauté)":"3–4 × 6 · RPE ~7";if(week===5)return ns?"3–4 × 6 · maintenir":"3–4 × 6 · RPE 7–8";return"3–4 × 6 · RPE 7–8 si stable"}if(t==="split"){if(week===1)return"3 × 6 / côté · RPE 6–7";if(week===2)return"3 × 6 / côté · RPE ~7";if(week===3)return"3 × 6 / côté · maintenir si nouvelle étape";if(week===4)return n?"3 × 6 / côté · maintenir":"3 × 6 / côté · légère progression possible";if(week===5)return ns?"3 × 6 / côté · maintenir":"3–4 × 6 / côté · RPE 7–8";return"3–4 × 6 / côté · RPE 7–8 si stable"}if(t==="calf"){if(week===1)return"3 × 8 / côté";if(week===2)return"3 × 8 / côté · un peu plus lourd si stable";if(week<=5)return"3 × 8 / côté · maintenir lors d'une nouveauté";return"3 × 6–8 / côté · plus lourd si stable"}if(t==="ham"){if(n)return week>=6?"Nordic assisté 2 × 4–5 · si jeudi sans courbatures gênantes":"Nordic assisté 2 × 3–4";return week===1?"Slider curl excentrique 3 × 6":"Slider curl excentrique 3 × 6–8"}}
function explosive(){let s=stage(week),n=stageAge();if(s===1)return[ex("Pogos",n===1?"3 × 10":"3 × 10–12","Petits contacts rapides, rebond depuis la cheville.",V.pogo,"pogo jumps tutorial"),ex("Réceptions stabilisées",n===1?"2 × 3 / côté":"3 × 3 / côté","Petit saut avant/latéral → réception souple → tenir 2–3 s.",null,"single leg landing stick drill")];if(s===2)return[ex("Pogos","2 × 10","Petit volume conservé.",V.pogo,"pogo jumps tutorial"),ex("Réceptions stabilisées","2 × 3 / côté","Priorité au contrôle.",null,"single leg landing stick drill"),ex("Lateral Bound + Stick","3 × 3 / côté","Bond latéral contrôlé, réception sur une jambe et arrêt complet.",V.bound,"lateral bound stick landing")];return[ex("Pogos","2 × 10","Petit volume maintenu.",V.pogo,"pogo jumps tutorial"),ex("Lateral Bounds","2–3 × 3 / côté","Bonds propres et contrôlés.",V.bound,"lateral bound stick landing"),ex("Accélération + freinage",n===1?"3 × 5 m · 60–70 %":"3–4 × 5–10 m · 70–80 %","Accélérer progressivement puis freiner proprement. Pas de sprint maximal.",null,"5m acceleration deceleration drill")]}
function warm(d){let t=prep("mardi");if(d==="mercredi")return["Vélo léger · 3 min","Knee-to-wall · 8–10 / côté","Spanish squat · 2 × 30 s",t.jumps?"Pogos retirés : mardi contenait sauts/sprint/COD":"Pogos très légers · 2 × 10","Shuffle latéral progressif · 2 × 10 m","2 séries progressives du medicine-ball · ~50 % puis ~70 %"];return["Vélo léger · 3 min","Knee-to-wall · 8–10 / côté","Spanish squat · 2 × 30 s","Pogos légers seulement si genou calme","Shuffle progressif","2 montées progressives avant le bloc explosif"]}
function data(d){if(d==="lundi")return{title:"Lundi · Padel léger",load:"low",sub:"Faible charge · isométriques + soléaire",extra:["Padel léger / plutôt statique"],ex:[ex("Wall Sit","4 × 45 s","Position confortable et stable. Pas de rebond.",V.wall,"wall sit exercise",["genou","isométrique"]),ex("Bent-Knee Soleus Raise Hold lesté","4 × 30–45 s","Genou fléchi, monter le talon et tenir. Charge progressive sans perdre l'amplitude.",null,"bent knee soleus calf raise hold weighted",["mollet","soléaire"])]};if(d==="mardi")return{title:"Mardi · Padel + prépa",load:"high",sub:"Élevée · aucun ajout",prep:"mardi",extra:["Padel ~1 h 30","Préparation physique ~40 min"],ex:[]};if(d==="mercredi")return{title:"Mercredi · Athletic A",load:"medium",sub:"Rotation · haut du corps · chaîne postérieure",ready:true,warm:true,ex:[ex("Medicine-Ball Rotational Throw","4 × 4 / côté","Explosif, repos complet. Ne pas chercher la fatigue.",V.med,"medicine ball rotational throw wall",["puissance","rotation"]),ex("Tractions","4 × 5–8","Quand 4×8 est propre et facile, ajouter progressivement du lest.",V.pull,"pull up proper form",["dos","force"]),ex("Landmine Press debout en fente","3 × 6–8 / côté","Bassin stable, pousser en diagonale sans compenser par le bas du dos.",null,"standing split stance landmine press",["épaule","stabilité"]),ex("Cable Row unilatéral anti-rotation","3 × 8–10 / côté","Tirer d'un bras, bassin et thorax face devant.",V.row,"single arm cable row anti rotation",["dos","anti-rotation"]),ex("RDL chargé",strength("rdl"),"Barre ou haltères. Hinge de hanche, colonne neutre, surcharge progressive.",V.rdl,"barbell Romanian deadlift proper form",["ischios","force"]),ex(nordic()?"Nordic assisté":"Slider Hamstring Curl excentrique",strength("ham"),nordic()?"Commencer très bas en volume. N'augmenter que si le jeudi suivant n'est pas gêné par les courbatures.":"Extension lente des jambes, hanches hautes. Progression future vers Nordic.",null,nordic()?"assisted Nordic hamstring curl tutorial":"slider hamstring curl eccentric",["ischios"])]};if(d==="jeudi")return{title:"Jeudi · Padel + prépa",load:"high",sub:"Élevée · aucun ajout",prep:"jeudi",extra:["Padel ~1 h 30","Préparation physique ~40 min"],ex:[]};if(d==="vendredi")return{title:"Vendredi · Récupération active",load:"low",sub:"15–20 min maximum · pas de fatigue recherchée",ex:[ex("Spanish Squat Hold","3 × 45 s","Isométrique confortable. Rester dans la règle douleur ≤3/10.",null,"Spanish squat hold patellar tendon",["genou"]),ex("Adductor Isometric","3 × 30 s / côté","Contraction forte mais contrôlée, bassin stable.",null,"adductor isometric squeeze exercise",["adducteurs"]),ex("Mobilité hanches · chevilles · thorax","8–10 min","Flow facile. Pas une séance supplémentaire.",null,"hip ankle thoracic mobility routine",["mobilité"])]};if(d==="samedi")return{title:"Samedi · Athletic B",load:"high",sub:"Élevée mais contrôlée · force unilatérale + explosif",ready:true,warm:true,expl:true,ex:[ex("Bloc explosif","Selon étape","Pogos/réceptions → bonds → accélérations + freinage. Progression seulement après 2 semaines stables.",null,"plyometric landing acceleration deceleration drills",["explosivité"]),ex("Push Press","3 × 5","Dip court, tronc vertical, extension explosive puis pousser la barre.",V.push,"push press proper form",["puissance"]),ex("Split Squat lesté",strength("split"),"Descente ~3 s. Amplitude indolore. Pas d'ATG imposé sous fatigue.",V.split,"dumbbell split squat proper form",["quadriceps","unilatéral"]),ex("Slant-Board Step Down","2–3 × 8 / côté","Descente 3–5 s. Genou et bassin contrôlés.",null,"slant board step down knee exercise",["freinage","genou"]),ex("Single-Leg Calf Raise lesté",strength("calf"),"Amplitude complète, montée forte, descente contrôlée.",null,"weighted single leg calf raise proper form",["mollet"]),ex("TRX Row → Face Pull","3 × 10","Tirage contrôlé puis face-pull pour le haut du dos et les épaules.",V.trx,"TRX row face pull tutorial",["dos","épaule"])]};return{title:"Dimanche · Repos",load:"low",sub:"Repos complet · mobilité douce seulement si envie",extra:["Si tournoi le week-end : la séance du samedi saute, elle n'est pas déplacée au dimanche."],ex:[]}}
function adapt(d){let r=ready(d);if(r==="reactive")return{c:"red",t:"REACTIVE : pas de bloc explosif. Réduis ou supprime la force jambes ; garde seulement les isométriques bien tolérés et le haut du corps."};let p=prep(d==="mercredi"?"mardi":"jeudi"),a=[];if(d==="mercredi"){if(p.quads)a.push("Mardi très quad/squat : RDL et ischios à ~2 séries, volume jambes −30 à −40 %.");if(p.posterior)a.push("Chaîne postérieure mardi : supprime le RDL ; ischios légers seulement si frais.");if(p.jumps)a.push("Sauts/sprint/COD mardi : pas de pogos mercredi ; aucun explosif jambes.");if(+p.rpe>=8)a.push("RPE mardi ≥8 : traite mercredi comme LOADED.");}else{if(p.jumps)a.push("Sauts/sprint/COD jeudi : réduis fortement ou supprime le bloc explosif samedi.");if(p.quads)a.push("Squats/fentes lourds jeudi : split squat 2–3×6 ; si quadriceps lourds, choisis split squat OU step-down.");if(p.calves)a.push("Mollets/sprint jeudi : calf raise 2×8 léger ou supprime si encore fatigué.");if(+p.rpe>=8)a.push("RPE jeudi ≥8 : réduis le volume jambes de 30–40 %.");}if(r==="loaded"&&!a.length)a.push("LOADED : baisse le volume jambes d'environ 30–40 %.");return a.length?{c:"orange",t:a.join(" ")}:{c:"green",t:"FRESH : programme complet si genou revenu à la baseline."}}
function tabs(){let e=document.getElementById("tabs");e.innerHTML="";DAYS.forEach(d=>{let b=document.createElement("button");b.className="tab"+(d===current?" active":"");b.textContent=LABEL[d];b.onclick=()=>{current=d;localStorage.setItem("pp-day",d);render()};e.appendChild(b)});document.getElementById("weekPick").value=week}function setWeek(v){week=+v;localStorage.setItem("pp-week",week);render()}
function done(d,i){return gb(K("done",week,d,i))}function toggleDone(d,i,v){sb(K("done",week,d,i),v);render()}function toggleV(id){document.getElementById(id)?.classList.toggle("open")}
function card(e,i,d){let dd=done(d,i),id="v-"+d+"-"+i,btn=e.video?`<button class="vbtn" onclick="toggleV('${id}')">▶ Vidéo</button>`:`<a class="vbtn" target="_blank" rel="noopener" href="${ys(e.search||e.name)}">🔎 Vidéo</a>`,vid=e.video?`<div class="video" id="${id}"><iframe loading="lazy" src="https://www.youtube-nocookie.com/embed/${e.video}" title="${esc(e.name)}" allowfullscreen></iframe><div class="vlinks"><a target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=${e.video}">Ouvrir sur YouTube ↗</a><a target="_blank" rel="noopener" href="${ys(e.search||e.name)}">Recherche de secours ↗</a></div></div>`:"";return`<section class="card ${dd?"done":""}"><div class="ctop"><input class="chk" type="checkbox" ${dd?"checked":""} onchange="toggleDone('${d}',${i},this.checked)"><div><div class="ename">${esc(e.name)}</div><div class="dose">${esc(e.dose)}</div><div class="cue">${esc(e.cue)}</div>${e.tags.length?`<div class="tags">${e.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>`:""}</div>${btn}</div>${vid}</section>`}

function readyUI(d){let r=ready(d);return`<div class="stitle"><h3>État du jour</h3><span>avant la séance</span></div><div class="stageRow"><button class="stage ${r==="fresh"?"active":""}" onclick="setReady('${d}','fresh')">🟢 Fresh</button><button class="stage ${r==="loaded"?"active":""}" onclick="setReady('${d}','loaded')">🟠 Loaded</button><button class="stage ${r==="reactive"?"active":""}" onclick="setReady('${d}','reactive')">🔴 Reactive</button></div>`}
function resetBtns(d){return`<div class="actions"><button class="action" onclick="resetDay('${d}')">Réinitialiser ce jour</button><button class="action danger" onclick="resetWeek()">Reset cases semaine</button></div>`}function resetDay(d){data(d).ex.forEach((_,i)=>localStorage.removeItem(K("done",week,d,i)));render()}function resetWeek(){if(!confirm("Réinitialiser les cases de S"+week+" ?"))return;["lundi","mercredi","vendredi","samedi"].forEach(d=>data(d).ex.forEach((_,i)=>localStorage.removeItem(K("done",week,d,i))));render()}
function day(d){let x=data(d),total=x.ex.length,dc=x.ex.filter((_,i)=>done(d,i)).length,out=`<section class="hero"><div class="heroTop"><div style="flex:1"><h2>${x.title}</h2><p>${x.sub}</p></div><span class="badge ${x.load}">● ${x.load==="high"?"Élevée":x.load==="medium"?"Moyenne":"Faible"}</span></div>${total?`<div class="progress"><div style="width:${dc/total*100}%"></div></div><div class="counter">${dc} / ${total} terminés · Semaine ${week}</div>`:""}</section>`;if(x.extra)out+=`<div class="notice green">${x.extra.map(z=>"• "+esc(z)).join("<br>")}</div>`;if(x.prep)return out+prepUI(x.prep)+resetBtns(d);if(x.ready)out+=readyUI(d);if(x.ready){let a=adapt(d);out+=`<div class="notice ${a.c}"><b>Adaptation :</b> ${esc(a.t)}</div>`}if(x.warm)out+=`<div class="warm"><h4>Échauffement · 8–10 min</h4><ol>${warm(d).map(z=>`<li>${esc(z)}</li>`).join("")}</ol></div>`;if(x.expl){let b=explosive();out+=`<div class="stitle"><h3>Bloc explosif · Étape ${stage(week)}</h3><span>${stageAge()===1?"1re semaine":"consolidation"}</span></div><div class="notice orange"><b>Critères :</b> 2 semaines stables avant l'étape suivante. Une seule nouveauté importante par semaine.</div>${b.map((e,i)=>{let id="x-"+i,btn=e.video?`<button class="vbtn" onclick="toggleV('${id}')">▶ Vidéo</button>`:`<a class="vbtn" target="_blank" rel="noopener" href="${ys(e.search)}">🔎 Vidéo</a>`,vid=e.video?`<div class="video" id="${id}"><iframe loading="lazy" src="https://www.youtube-nocookie.com/embed/${e.video}" title="${esc(e.name)}" allowfullscreen></iframe><div class="vlinks"><a target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=${e.video}">Ouvrir sur YouTube ↗</a></div></div>`:"";return`<section class="card"><div class="ctop"><div style="font-size:18px">⚡</div><div><div class="ename">${esc(e.name)}</div><div class="dose">${esc(e.dose)}</div><div class="cue">${esc(e.cue)}</div></div>${btn}</div>${vid}</section>`}).join("")}<div class="stitle"><h3>Force / puissance</h3><span>6 blocs max</span></div>`}else if(total)out+=`<div class="stitle"><h3>Programme</h3><span>${total} exercices</span></div>`;if(total)out+=x.ex.map((e,i)=>card(e,i,d)).join("");else if(d==="dimanche")out+=`<div class="empty">Repos. Pas de séance jambes cachée. 👌</div>`;out+=resetBtns(d)+`<div class="foot">Règle genou : douleur ≤3/10, retour à la baseline le lendemain, pas de gonflement. Si deux jours consécutifs se dégradent : retirer d'abord l'explosif, puis réduire le volume jambes.</div>`;return out}
function setCrit(f,v){sb(K("crit",week,f),v);render()}function tracking(){let s=stage(week),c=crit(week),ok=canAdvance(),nd=newStage()&&week>1;return`<section class="hero"><div class="heroTop"><div style="flex:1"><h2>Suivi · Semaine ${week}</h2><p>Progression par critères, pas par calendrier automatique.</p></div><span class="badge medium">Étape ${s}/3</span></div></section><div class="stitle"><h3>Étape explosive actuelle</h3><span>bloc 1</span></div><div class="stageRow">${[1,2,3].map(n=>`<button class="stage ${s===n?"active":""}" onclick="setStage(${n})">Étape ${n} · ${n===1?"Pogos + réceptions":n===2?"Bounds":"Accélération + freinage"}</button>`).join("")}</div><div class="notice ${ok?"green":"orange"}">${ok?`<b>Éligible :</b> 2 semaines précédentes stables à la même étape. Tu peux envisager l'étape ${Math.min(3,stage(week-1)+1)}.`:`<b>Pas de passage automatique :</b> 2 semaines consécutives stables à la même étape sont nécessaires.`}</div><div class="stitle"><h3>Validation de cette semaine</h3><span>fin de semaine</span></div><div class="criteria"><label class="crit"><input type="checkbox" ${c.pain?"checked":""} onchange="setCrit('pain',this.checked)"><span><b>Douleur ≤ 3/10</b><br><span class="sub">Pendant exercices / sport.</span></span></label><label class="crit"><input type="checkbox" ${c.base?"checked":""} onchange="setCrit('base',this.checked)"><span><b>Retour à la baseline le lendemain</b></span></label><label class="crit"><input type="checkbox" ${c.swell?"checked":""} onchange="setCrit('swell',this.checked)"><span><b>Pas de gonflement / sensation de liquide</b></span></label></div><div class="notice ${stable(week)?"green":"orange"}">${stable(week)?"<b>Semaine stable ✓</b>":"<b>Semaine non validée</b> · reste à la même étape ou réduis."}</div><div class="stitle"><h3>Nordic assisté</h3><span>une seule nouveauté</span></div><label class="crit" style="${nd?"opacity:.55":""}"><input type="checkbox" ${nordic()?"checked":""} ${nd?"disabled":""} onchange="setNordic(this.checked)"><span><b>Nordic introduit cette semaine</b><br><span class="sub">${nd?"Bloqué : nouvelle étape explosive cette semaine.":"Départ 2×3–4. Augmenter seulement si le jeudi suivant n'est pas gêné par les courbatures."}</span></span></label><div class="stitle"><h3>Historique 6 semaines</h3><span>étape + stabilité</span></div><div class="weekcards">${[1,2,3,4,5,6].map(w=>`<div class="wcard"><b>S${w} · Étape ${stage(w)}</b><div>${stable(w)?"✅ stable":"⬜ à valider"}</div></div>`).join("")}</div><div class="stitle"><h3>Bloc 2 · aperçu</h3><span>après étape 3 stable</span></div><div class="rule">Accélérations plus rapides → changements de direction planifiés → COD réactifs → sprint / actions padel plus intenses. Petit volume de pogos et bounds maintenu.</div><div class="notice orange"><b>&gt;80 % vitesse :</b> seulement avec critères genou validés ET 20 montées de mollet unilatérales propres et relativement symétriques.</div><div class="rule"><b>Une seule nouveauté par semaine :</b> jamais nouvelle étape explosive + hausse importante de force jambes, ni nouvelle étape + Nordic, ni Nordic + grosse hausse de volume.</div>`}
function render(){tabs();document.getElementById("app").innerHTML=current==="suivi"?tracking():day(current)}render();
</script>
</body>
</html>
